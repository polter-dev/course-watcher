# Valencia College Course Watcher Configuration
# Copy to config.yaml and edit to your needs.

# Banner term code. Find valid codes by hitting:
#   https://banner.aws.valenciacollege.edu/StudentRegistrationSsb/ssb/classSearch/getTerms?searchTerm=&offset=1&max=30
# Format: YYYYTT where TT = 10 (Fall), 20 (Spring), 30 (Summer)
term: "202630"

# Courses to watch. Each entry needs EITHER:
#   - crn: a specific CRN (string or int)
#   - subject + courseNumber: matches ALL sections of that course
# You can mix and match.
courses:
  - subject: PHY
    courseNumber: "2049C"
  # - crn: "12345"
  # - subject: COP
  #   courseNumber: "2210C"

# Poll interval in seconds. Banner is polled once per interval.
# Don't go below 60s — be polite to the server.
poll_interval: 180

# Random jitter added/subtracted from poll_interval (seconds).
# Avoids a fixed polling pattern.
poll_jitter: 15

# Only track online sections (instructionalMethod == "X").
# When true, in-person and Mixed Mode sections are excluded from
# polling, state tracking, and notifications. If no online sections
# exist for a watch target, the watcher continues running and will
# notify you when one is added. Default true.
online_only: true

# Send a notification when a brand-new section (CRN not previously seen)
# appears in search results. Respects online_only — if enabled, only new
# online sections trigger notifications. Does not fire on first run.
# Default true.
notify_new_sections: true

# Send notifications when waitlist spots open (0 → >0).
# Default off — most Valencia sections have waitCapacity=0 anyway.
notify_waitlist: false

# Path to the JSON file that persists seat counts between restarts.
# Written atomically (tmp + rename) so it's never corrupt.
state_file: "seats.json"

# Discord webhook URL is read from the DISCORD_WEBHOOK environment variable.
# NEVER put it in this file.
